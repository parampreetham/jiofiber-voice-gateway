<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JioFiber Voice — Cross-Platform Calling</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .audio-pulse { animation: pulse-ring 2s infinite ease-in-out; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen text-slate-100 flex items-center justify-center p-4">
  <div id="app" class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden p-6 relative">
    
    <!-- Top Header -->
    <div class="flex items-center justify-between pb-4 border-b border-slate-800">
      <div>

        </div>
        <h1 class="text-lg font-bold text-white tracking-tight" id="landlineNumber">+91 81327 96216</h1>
        <p class="text-xs text-slate-400">Router: 192.168.31.1 (SIP-TLS)</p>
      </div>
      <div class="bg-indigo-600/20 border border-indigo-500/30 text-indigo-300 text-xs px-2.5 py-1 rounded-full flex items-center gap-1.5">
        <span>Echo Dot Ready</span>
      </div>
    </div>

    <!-- Incoming Call Banner (Hidden by default) -->
    <div id="incomingCallModal" class="hidden absolute inset-0 bg-slate-950/95 z-50 flex flex-col items-center justify-center p-6 text-center animate-fade-in">
      <div class="w-20 h-20 rounded-full bg-indigo-600/20 border-2 border-indigo-500 flex items-center justify-center mb-4 animate-bounce">
        <svg class="w-10 h-10 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
        </svg>
      </div>
      <span class="text-xs font-semibold tracking-wider text-indigo-400 uppercase">Incoming Call on Landline</span>
      <h2 id="incomingCallerNumber" class="text-2xl font-bold text-white my-1">+91 98451 31764</h2>
      <p class="text-xs text-slate-400 mb-8">Also ringing on your Echo Dot & Landline</p>

      <div class="flex items-center gap-6">
        <button onclick="rejectCall()" class="w-16 h-16 rounded-full bg-rose-600 hover:bg-rose-500 flex items-center justify-center text-white shadow-lg shadow-rose-600/40 transition">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">

          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Active Call Screen (Hidden by default) -->
    <div id="activeCallScreen" class="hidden py-8 text-center">
      <div class="relative w-24 h-24 mx-auto mb-4 flex items-center justify-center">
        <div class="absolute inset-0 rounded-full bg-emerald-500/20 audio-pulse"></div>
        <div class="w-20 h-20 rounded-full bg-emerald-500/10 border-2 border-emerald-500 flex items-center justify-center relative z-10">
          <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z" />
          </svg>
        </div>
      </div>
      <h2 id="activeCallerName" class="text-xl font-bold text-white">+91 98451 31764</h2>
      <p id="callTimer" class="text-sm text-emerald-400 font-mono mt-1">00:00</p>
      <div class="inline-flex items-center gap-1.5 mt-2 bg-slate-800/80 px-3 py-1 rounded-full text-xs text-slate-300">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span id="callAudioStatus">Audio Streaming (G.711u 64kbps)</span>
      </div>

      <div class="mt-8 flex justify-center items-center gap-6">
        <!-- Mute Button -->
        <button id="muteBtn" onclick="toggleMute()" class="w-12 h-12 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 hover:text-white transition shadow">
          <svg id="micIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z" />
          </svg>
        </button>

        <!-- Hangup Button -->
        <button onclick="hangupCall()" class="w-16 h-16 rounded-full bg-rose-600 hover:bg-rose-500 active:scale-95 flex items-center justify-center text-white shadow-lg shadow-rose-600/40 transition">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Dialer Screen -->
    <div id="dialerScreen" class="py-4">
      <!-- Number Display -->
      <div class="my-4 text-center">
        <input type="text" id="dialInput" placeholder="Enter number..." class="w-full bg-transparent text-center text-2xl font-semibold text-white tracking-wider outline-none placeholder:text-slate-600" />
      </div>

      <!-- Keypad Grid -->
      <div class="grid grid-cols-3 gap-3 my-4 max-w-xs mx-auto">
        <button onclick="pressKey('1')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">1<span class="text-[9px] text-slate-400 font-normal">&nbsp;</span></button>
        <button onclick="pressKey('2')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">2<span class="text-[9px] text-slate-400 font-normal">ABC</span></button>
        <button onclick="pressKey('3')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">3<span class="text-[9px] text-slate-400 font-normal">DEF</span></button>
        <button onclick="pressKey('4')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">4<span class="text-[9px] text-slate-400 font-normal">GHI</span></button>
        <button onclick="pressKey('5')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">5<span class="text-[9px] text-slate-400 font-normal">JKL</span></button>
        <button onclick="pressKey('6')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">6<span class="text-[9px] text-slate-400 font-normal">MNO</span></button>
        <button onclick="pressKey('7')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">7<span class="text-[9px] text-slate-400 font-normal">PQRS</span></button>
        <button onclick="pressKey('8')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">8<span class="text-[9px] text-slate-400 font-normal">TUV</span></button>
        <button onclick="pressKey('9')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">9<span class="text-[9px] text-slate-400 font-normal">WXYZ</span></button>
        <button onclick="pressKey('*')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">*<span class="text-[9px] text-slate-400 font-normal">&nbsp;</span></button>
        <button onclick="pressKey('0')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">0<span class="text-[9px] text-slate-400 font-normal">+</span></button>
        <button onclick="pressKey('#')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">#<span class="text-[9px] text-slate-400 font-normal">&nbsp;</span></button>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center justify-center gap-6 mt-6">
        <button onclick="clearLastDigit()" class="w-12 h-12 rounded-full text-slate-400 hover:text-white flex items-center justify-center transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-7.172a2 2 0 00-1.414.586L3 12z" />
          </svg>
        </button>
        <button onclick="startCall()" class="w-16 h-16 rounded-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 flex items-center justify-center text-white shadow-lg shadow-emerald-600/30 transition">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Footer Devices Status -->
    <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500">
      <span>Gateway: <span class="text-emerald-400 font-mono">192.168.31.1</span></span>
      <span>Circle: <span class="text-slate-300">Karnataka (KA)</span></span>
    </div>
  </div>

  <script>
    let ws;
    let timerInterval = null;
    let secondsElapsed = 0;
    let isMuted = false;

    // Web Audio Engine & State
    let audioCtx = null;
    let micStream = null;
    let micNode = null;
    let playerNode = null;
    let dummySource = null;

    let activeCodec = "PCMA";
    let activePayloadType = 8; // Default PCMA for Indian landlines

    // Audio Jitter Resampler Queue
    class AudioResampleQueue {
      constructor(inputRate, outputRate) {
        this.step = inputRate / outputRate;
        this.queue = [];
        this.totalSamples = 0;
        this.readIndex = 0;
        this.frac = 0;
        this.started = false;
      }

      push(samples) {
        this.queue.push(samples);
        this.totalSamples += samples.length;
        if (!this.started && this.totalSamples >= 320) {
          this.started = true;
        }
        // Bound latency: if queue exceeds 250ms (2000 samples at 8kHz), drop oldest
        if (this.totalSamples > 2000) {
          while (this.totalSamples > 800 && this.queue.length > 1) {
            this.totalSamples -= (this.queue[0].length - this.readIndex);
            this.queue.shift();
            this.readIndex = 0;
          }
        }
      }

      readNext() {
        if (!this.started || this.queue.length === 0) return 0;

        const chunk = this.queue[0];
        const s0 = chunk[this.readIndex];
        const s1 = (this.readIndex + 1 < chunk.length)
          ? chunk[this.readIndex + 1]
          : (this.queue.length > 1 ? this.queue[1][0] : s0);

        const outSample = s0 + this.frac * (s1 - s0);

        this.frac += this.step;
        while (this.frac >= 1.0) {
          this.frac -= 1.0;
          this.readIndex++;
          this.totalSamples--;
          if (this.readIndex >= chunk.length) {
            this.queue.shift();
            this.readIndex = 0;
            if (this.queue.length === 0) break;
          }
        }
        return outSample;
      }

      clear() {
        this.queue = [];
        this.totalSamples = 0;
        this.readIndex = 0;
        this.frac = 0;
        this.started = false;
      }
    }

    let resampleQueue = null;

    // G.711 A-law (PT 8) Decode Lookup Table
    const ALAW_TABLE = new Int16Array(256);
    for (let i = 0; i < 256; i++) {
      let a = i ^ 0x55;
      let sign = a & 0x80;
      let exponent = (a >> 4) & 0x07;
      let mantissa = a & 0x0f;
      let sample = (exponent === 0) ? (mantissa << 4) + 8 : ((mantissa << 4) + 0x108) << (exponent - 1);
      ALAW_TABLE[i] = sign !== 0 ? sample : -sample;
    }

    // G.711 u-law (PT 0) Decode Lookup Table
    const ULAW_TABLE = new Int16Array(256);
    for (let i = 0; i < 256; i++) {
      let u = ~i & 0xff;
      let sign = u & 0x80;
      let exponent = (u >> 4) & 0x07;
      let mantissa = u & 0x0f;
      let sample = ((mantissa << 3) + 0x84) << exponent;
      sample -= 0x84;
      ULAW_TABLE[i] = sign !== 0 ? -sample : sample;
    }

    // G.711 A-law Encoder (PT 8)
    function encodeAlawSample(pcm16) {
      let sign = (pcm16 >= 0) ? 0x80 : 0;
      if (pcm16 < 0) pcm16 = -pcm16;
      if (pcm16 > 32767) pcm16 = 32767;
      let exponent = 7;
      for (let expMask = 0x4000; (pcm16 & expMask) === 0 && exponent > 0; exponent--, expMask >>= 1) {}
      let mantissa = (exponent === 0) ? (pcm16 >> 4) & 0x0f : (pcm16 >> (exponent + 3)) & 0x0f;
      return ((sign | (exponent << 4) | mantissa) ^ 0x55) & 0xff;
    }

    // G.711 u-law Encoder (PT 0)
    const BIAS = 0x84;
    const CLIP = 32635;
    function encodeUlawSample(pcm) {
      let sign = (pcm >> 8) & 0x80;
      if (sign !== 0) pcm = -pcm;
      if (pcm > CLIP) pcm = CLIP;
      pcm += BIAS;
      let exponent = 7;
      for (let expMask = 0x4000; (pcm & expMask) === 0 && exponent > 0; exponent--, expMask >>= 1) {}
      let mantissa = (pcm >> (exponent + 3)) & 0x0f;
      return ~(sign | (exponent << 4) | mantissa) & 0xff;
    }

    async function initAudioEngine() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      if (!resampleQueue) {
        resampleQueue = new AudioResampleQueue(8000, audioCtx.sampleRate);
      }

      // Initialize continuous playback node
      if (!playerNode) {
        playerNode = audioCtx.createScriptProcessor(1024, 1, 1);
        playerNode.onaudioprocess = (e) => {
          const out = e.outputBuffer.getChannelData(0);
          const outLen = out.length;

          if (!resampleQueue) {
            out.fill(0);
            return;
          }

          for (let i = 0; i < outLen; i++) {
            out[i] = resampleQueue.readNext();
          }
        };

        dummySource = audioCtx.createConstantSource();
        dummySource.offset.value = 0;
        dummySource.connect(playerNode);
        playerNode.connect(audioCtx.destination);
        dummySource.start();
        console.log("[Audio] Continuous playback queue active at", audioCtx.sampleRate, "Hz");
      }

      // Initialize microphone capture
      if (!micStream) {
        try {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true,
            }
          });

          const micSource = audioCtx.createMediaStreamSource(micStream);
          const bufferSize = 2048;
          micNode = audioCtx.createScriptProcessor(bufferSize, 1, 1);

          const inputSampleRate = audioCtx.sampleRate;
          const targetSampleRate = 8000;
          const resampleRatio = targetSampleRate / inputSampleRate;
          let resampleBuffer = [];

          micNode.onaudioprocess = (e) => {
            const out = e.outputBuffer.getChannelData(0);
            out.fill(0);

            if (isMuted) return;

            const input = e.inputBuffer.getChannelData(0);
            const outLength = Math.floor(input.length * resampleRatio);

            for (let i = 0; i < outLength; i++) {
              let inIdx = Math.floor(i / resampleRatio);
              let sample = input[inIdx];
              let pcm16 = Math.max(-32768, Math.min(32767, Math.floor(sample * 32767)));
              const encoded = (activePayloadType === 0) ? encodeUlawSample(pcm16) : encodeAlawSample(pcm16);
              resampleBuffer.push(encoded);
            }

            // Send in 160-sample (20ms) chunks
            while (resampleBuffer.length >= 160) {
              const chunk = new Uint8Array(resampleBuffer.splice(0, 160));
              if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(chunk.buffer);
              }
            }
          };

          micSource.connect(micNode);

          // Route mic processor through zero gain to prevent ANY speaker acoustic feedback
          const silenceGain = audioCtx.createGain();
          silenceGain.gain.value = 0;
          micNode.connect(silenceGain);
          silenceGain.connect(audioCtx.destination);

          console.log("[Audio] Microphone stream capture active at 8000 Hz (" + activeCodec + ")");
        } catch (err) {
          console.warn("[Audio] Could not access microphone:", err.message);
        }
      }
    }

    function stopAudioEngine() {
      if (dummySource) {
        try { dummySource.stop(); } catch (e) {}
        dummySource.disconnect();
        dummySource = null;
      }
      if (playerNode) {
        playerNode.disconnect();
        playerNode = null;
      }
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      if (micNode) {
        micNode.disconnect();
        micNode = null;
      }
      if (resampleQueue) {
        resampleQueue.clear();
      }
    }

    function playIncomingAudio(buffer) {
      if (!audioCtx || !playerNode) {
        initAudioEngine();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const uint8 = new Uint8Array(buffer);
      if (uint8.length === 0) return;

      let pt = activePayloadType;
      let data = uint8;
      // If packet has 1-byte PT prefix (e.g. 161 bytes):
      if (uint8.length === 161) {
        pt = uint8[0];
        data = uint8.subarray(1);
      }

      const table = (pt === 0) ? ULAW_TABLE : ALAW_TABLE;
      const len = data.length;
      const pcmFloat = new Float32Array(len);

      for (let i = 0; i < len; i++) {
        pcmFloat[i] = table[data[i]] / 32768.0;
      }

      if (resampleQueue) {
        resampleQueue.push(pcmFloat);
      }
    }

    function connectWS() {
      ws = new WebSocket("ws://localhost:8088");
      ws.binaryType = "arraybuffer";

      ws.onopen = () => console.log("Connected to JioFiber Voice Gateway");

      ws.onmessage = async (event) => {
        // Binary data = Incoming Audio payload from Jio IMS
        let arrayBuffer = null;
        if (event.data instanceof ArrayBuffer) {
          arrayBuffer = event.data;
        } else if (event.data instanceof Blob) {
          arrayBuffer = await event.data.arrayBuffer();
        }

        if (arrayBuffer) {
          playIncomingAudio(arrayBuffer);
          return;
        }

        try {
          const msg = JSON.parse(event.data);
          console.log("Gateway message:", msg);

          if (msg.type === "incoming_call") {
            showIncomingCall(msg.call.caller);
          } else if (msg.type === "call_state") {
            if (msg.call.state === "active" || msg.call.state === "ringing") {
              showActiveCall(msg.call.caller);
            } else if (msg.call.state === "ending" || msg.call.state === "ended" || msg.call.state === "failed") {
              hideActiveCall();
            }
          } else if (msg.type === "call_ended") {
            hideActiveCall();
          } else if (msg.type === "sip_status") {
            const dot = document.getElementById("sipStatusDot");
            const text = document.getElementById("sipStatusText");
            if (msg.registered) {
              dot.className = "inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
              text.className = "text-xs uppercase tracking-wider text-emerald-400 font-semibold";
              text.innerText = "JioFiber Voice (Online)";
            } else {
              dot.className = "inline-block w-2.5 h-2.5 rounded-full bg-rose-500";
              text.className = "text-xs uppercase tracking-wider text-rose-400 font-semibold";
              text.innerText = "SIP Connecting...";
            }
          } else if (msg.type === "audio_codec") {
            activeCodec = msg.codec;
            activePayloadType = msg.payloadType;
            console.log("[Audio] Negotiated codec:", activeCodec, "PT:", activePayloadType);
            const audioLabel = document.getElementById("callAudioStatus");
            if (audioLabel) {
              audioLabel.innerText = `Audio Streaming (${activeCodec} 64kbps)`;
            }
          }
        } catch (e) {
          console.error("Failed parsing message:", e);
        }
      };

      ws.onclose = () => setTimeout(connectWS, 2000);
    }

    function pressKey(k) {
      document.getElementById('dialInput').value += k;
    }

    function clearLastDigit() {
      const el = document.getElementById('dialInput');
      el.value = el.value.slice(0, -1);
    }

    async function startCall() {
      const num = document.getElementById('dialInput').value;
      if (!num) return;

      await initAudioEngine();

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "dial", destination: num }));
      }
      showActiveCall(num);
    }

    async function answerCall() {
      document.getElementById('incomingCallModal').classList.add('hidden');
      await initAudioEngine();

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "answer" }));
      }
      showActiveCall(document.getElementById('incomingCallerNumber').innerText);
    }

    function rejectCall() {
      document.getElementById('incomingCallModal').classList.add('hidden');
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "hangup" }));
      }
    }

    function hangupCall() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "hangup" }));
      }
      hideActiveCall();
    }

    function toggleMute() {
      isMuted = !isMuted;
      const btn = document.getElementById('muteBtn');
      if (isMuted) {
        btn.classList.add('bg-rose-600/40', 'text-rose-400');
        btn.classList.remove('bg-slate-800', 'text-slate-300');
      } else {
        btn.classList.remove('bg-rose-600/40', 'text-rose-400');
        btn.classList.add('bg-slate-800', 'text-slate-300');
      }
    }

    function showIncomingCall(caller) {
      document.getElementById('incomingCallerNumber').innerText = caller;
      document.getElementById('incomingCallModal').classList.remove('hidden');
    }

    function showActiveCall(name) {
      document.getElementById('incomingCallModal').classList.add('hidden');
      document.getElementById('dialerScreen').classList.add('hidden');
      document.getElementById('activeCallScreen').classList.remove('hidden');
      document.getElementById('activeCallerName').innerText = name;

      secondsElapsed = 0;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('callTimer').innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function hideActiveCall() {
      clearInterval(timerInterval);
      stopAudioEngine();
      document.getElementById('activeCallScreen').classList.add('hidden');
      document.getElementById('incomingCallModal').classList.add('hidden');
      document.getElementById('dialerScreen').classList.remove('hidden');
    }

    connectWS();
  </script>
</body>
</html>
