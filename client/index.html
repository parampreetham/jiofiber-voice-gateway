<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JioFiber Voice — Cross-Platform Calling</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen text-slate-100 flex items-center justify-center p-4">
  <div id="app" class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden p-6 relative">
    
    <!-- Top Header -->
    <div class="flex items-center justify-between pb-4 border-b border-slate-800">
      <div>
        <div class="flex items-center space-x-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="text-xs uppercase tracking-wider text-emerald-400 font-semibold">JioFiber Voice</span>
        </div>
        <h1 class="text-lg font-bold text-white tracking-tight" id="landlineNumber">+91 81327 96216</h1>
        <p class="text-xs text-slate-400">Router: 192.168.31.1 (SIP-TLS)</p>
      </div>
      <div class="bg-indigo-600/20 border border-indigo-500/30 text-indigo-300 text-xs px-2.5 py-1 rounded-full flex items-center gap-1.5">
        <span>Echo Dot Ready</span>
      </div>
    </div>

    <!-- Incoming Call Banner (Hidden by default) -->
    <div id="incomingCallModal" class="hidden absolute inset-0 bg-slate-950/95 z-50 flex flex-col items-center justify-center p-6 text-center animate-fade-in">
      <div class="w-20 h-20 rounded-full bg-indigo-600/20 border-2 border-indigo-500 flex items-center justify-center mb-4 animate-bounce">
        <svg class="w-10 h-10 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
        </svg>
      </div>
      <span class="text-xs font-semibold tracking-wider text-indigo-400 uppercase">Incoming Call on Landline</span>
      <h2 id="incomingCallerNumber" class="text-2xl font-bold text-white my-1">+91 98451 31764</h2>
      <p class="text-xs text-slate-400 mb-8">Also ringing on your Echo Dot & Landline</p>

      <div class="flex items-center gap-6">
        <button onclick="rejectCall()" class="w-16 h-16 rounded-full bg-rose-600 hover:bg-rose-500 flex items-center justify-center text-white shadow-lg shadow-rose-600/40 transition">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
        <button onclick="answerCall()" class="w-16 h-16 rounded-full bg-emerald-600 hover:bg-emerald-500 flex items-center justify-center text-white shadow-lg shadow-emerald-600/40 transition">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Active Call Screen (Hidden by default) -->
    <div id="activeCallScreen" class="hidden py-8 text-center">
      <div class="w-20 h-20 rounded-full bg-emerald-500/10 border-2 border-emerald-500 mx-auto flex items-center justify-center mb-4">
        <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
        </svg>
      </div>
      <h2 id="activeCallerName" class="text-xl font-bold text-white">+91 98451 31764</h2>
      <p id="callTimer" class="text-sm text-emerald-400 font-mono mt-1">00:00</p>
      <p class="text-xs text-slate-500 mt-1">Codec: AMR-WB (16kHz HD Voice)</p>

      <div class="mt-8 flex justify-center gap-4">
        <button onclick="hangupCall()" class="w-14 h-14 rounded-full bg-rose-600 hover:bg-rose-500 flex items-center justify-center text-white shadow-lg transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Dialer Screen -->
    <div id="dialerScreen" class="py-4">
      <!-- Number Display -->
      <div class="my-4 text-center">
        <input type="text" id="dialInput" placeholder="Enter number..." class="w-full bg-transparent text-center text-2xl font-semibold text-white tracking-wider outline-none placeholder:text-slate-600" />
      </div>

      <!-- Keypad Grid -->
      <div class="grid grid-cols-3 gap-3 my-4 max-w-xs mx-auto">
        <button onclick="pressKey('1')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">1<span class="text-[9px] text-slate-400 font-normal">&nbsp;</span></button>
        <button onclick="pressKey('2')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">2<span class="text-[9px] text-slate-400 font-normal">ABC</span></button>
        <button onclick="pressKey('3')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">3<span class="text-[9px] text-slate-400 font-normal">DEF</span></button>
        <button onclick="pressKey('4')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">4<span class="text-[9px] text-slate-400 font-normal">GHI</span></button>
        <button onclick="pressKey('5')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">5<span class="text-[9px] text-slate-400 font-normal">JKL</span></button>
        <button onclick="pressKey('6')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">6<span class="text-[9px] text-slate-400 font-normal">MNO</span></button>
        <button onclick="pressKey('7')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">7<span class="text-[9px] text-slate-400 font-normal">PQRS</span></button>
        <button onclick="pressKey('8')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">8<span class="text-[9px] text-slate-400 font-normal">TUV</span></button>
        <button onclick="pressKey('9')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">9<span class="text-[9px] text-slate-400 font-normal">WXYZ</span></button>
        <button onclick="pressKey('*')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">*<span class="text-[9px] text-slate-400 font-normal">&nbsp;</span></button>
        <button onclick="pressKey('0')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">0<span class="text-[9px] text-slate-400 font-normal">+</span></button>
        <button onclick="pressKey('#')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 transition text-lg font-bold text-white flex flex-col items-center justify-center">#<span class="text-[9px] text-slate-400 font-normal">&nbsp;</span></button>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center justify-center gap-6 mt-6">
        <button onclick="clearLastDigit()" class="w-12 h-12 rounded-full text-slate-400 hover:text-white flex items-center justify-center transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-7.172a2 2 0 00-1.414.586L3 12z" />
          </svg>
        </button>
        <button onclick="startCall()" class="w-16 h-16 rounded-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 flex items-center justify-center text-white shadow-lg shadow-emerald-600/30 transition">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
          </svg>
        </button>
        <button onclick="testIncoming()" title="Test Incoming Call" class="w-12 h-12 rounded-full text-indigo-400 hover:text-indigo-300 flex items-center justify-center transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Footer Devices Status -->
    <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500">
      <span>Gateway: <span class="text-emerald-400 font-mono">192.168.31.1</span></span>
      <span>Circle: <span class="text-slate-300">Karnataka (KA)</span></span>
    </div>
  </div>

  <script>
    let ws;
    let timerInterval = null;
    let secondsElapsed = 0;

    function connectWS() {
      ws = new WebSocket("ws://localhost:8088");
      ws.onopen = () => console.log("Connected to JioFiber Voice Gateway");
      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        console.log("Gateway message:", msg);

        if (msg.type === "incoming_call") {
          showIncomingCall(msg.call.caller);
        } else if (msg.type === "call_state") {
          if (msg.call.state === "active") {
            showActiveCall(msg.call.caller);
          } else if (msg.call.state === "ending") {
            hideActiveCall();
          }
        } else if (msg.type === "call_ended") {
          hideActiveCall();
        }
      };
      ws.onclose = () => setTimeout(connectWS, 2000);
    }

    function pressKey(k) {
      document.getElementById('dialInput').value += k;
    }

    function clearLastDigit() {
      const el = document.getElementById('dialInput');
      el.value = el.value.slice(0, -1);
    }

    function startCall() {
      const num = document.getElementById('dialInput').value;
      if (!num) return;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "dial", destination: num }));
      }
      showActiveCall(num);
    }

    function answerCall() {
      document.getElementById('incomingCallModal').classList.add('hidden');
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "answer" }));
      }
      showActiveCall(document.getElementById('incomingCallerNumber').innerText);
    }

    function rejectCall() {
      document.getElementById('incomingCallModal').classList.add('hidden');
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "hangup" }));
      }
    }

    function hangupCall() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "hangup" }));
      }
      hideActiveCall();
    }

    function showIncomingCall(caller) {
      document.getElementById('incomingCallerNumber').innerText = caller;
      document.getElementById('incomingCallModal').classList.remove('hidden');
    }

    function showActiveCall(name) {
      document.getElementById('incomingCallModal').classList.add('hidden');
      document.getElementById('dialerScreen').classList.add('hidden');
      document.getElementById('activeCallScreen').classList.remove('hidden');
      document.getElementById('activeCallerName').innerText = name;

      secondsElapsed = 0;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('callTimer').innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function hideActiveCall() {
      clearInterval(timerInterval);
      document.getElementById('activeCallScreen').classList.add('hidden');
      document.getElementById('incomingCallModal').classList.add('hidden');
      document.getElementById('dialerScreen').classList.remove('hidden');
    }

    function testIncoming() {
      fetch("http://localhost:8088/api/call/incoming", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ caller: "+91 98451 31764" })
      });
    }

    connectWS();
  </script>
</body>
</html>
